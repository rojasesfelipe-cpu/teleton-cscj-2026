<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#b30023" />
<title>Teletón 2026 | Colegio Sagrado Corazón de Jesús</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="background-mark one"></div><div class="background-mark two"></div>
<div id="confetti" aria-hidden="true"></div>
<div class="screen">
<header class="header">
  <div class="brand-school"><img src="assets/logo-colegio.png" alt="Logo del Colegio Sagrado Corazón de Jesús"><div><span class="overline">UNIDOS POR UNA GRAN CAUSA</span><strong>Colegio Sagrado<br>Corazón de Jesús</strong></div></div>
  <div class="edition">CAMPAÑA SOLIDARIA <b>2026</b><span class="edition-heart">♥</span></div>
  <div class="connection"><span id="dot" class="dot"></span><span id="status">Conectando con la planilla…</span></div>
</header>
<main>
  <div class="mascot"><div class="mascot-halo"></div><img src="assets/teletin.png" alt="Teletín, mascota de la Teletón"></div>
  <section class="spotlight" aria-live="polite">
    <div class="eyebrow" id="category">RECAUDACIÓN POR CURSO</div>
    <h1 id="name">¡Vamos por la Teletón!</h1>
    <div class="amount-wrap"><span class="currency">$</span><div id="amount" class="amount">—</div></div>
    <div class="pill" id="message">¡Juntos hacemos la diferencia!</div>
  </section>
  <aside class="symbol"><div class="symbol-halo"></div><img src="assets/simbolo-teleton.png" alt="Símbolo Teletón"><span>TELETÓN<br><b>2026</b></span></aside>
</main>
<footer>
 <div class="footer-totals"><div><small>FUNCIONARIOS</small><strong id="staff">—</strong></div><div class="line"></div><div><small>TOTAL COLEGIO</small><strong id="school">—</strong></div></div>
 <div class="operator"><div class="keys"><kbd>←</kbd><kbd>→</kbd></div><span>Cambiar curso</span><span class="separator">•</span><kbd>F</kbd><span>Pantalla completa</span><span class="separator">•</span><kbd>R</kbd><span>Actualizar</span></div>
 <div class="page-number" id="counter">— / —</div>
</footer>
</div>
<script src="app.js" defer></script>
</body>
</html>
